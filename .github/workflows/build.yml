name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # tag e.g. v1.0.0 -> also creates a GitHub Release
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconsole --onefile --name TraxCDC
          --collect-all fitz --collect-all pymupdf
          --hidden-import extractor --hidden-import gemini_fallback
          gui.py

      - name: Package (EXE + README)
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/TraxCDC.exe, dist/README.md -DestinationPath TraxCDC-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TraxCDC-windows
          path: TraxCDC-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TraxCDC-windows.zip
